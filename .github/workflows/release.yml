name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Configure test data directory
        run: echo "AOCSUITE_DATA_DIR=${RUNNER_TEMP}/aocsuite-data" >> "$GITHUB_ENV"

      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          tag = os.environ["TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              sys.exit(f"release tag must use vMAJOR.MINOR.PATCH, got {tag!r}")
          version = tag[1:]
          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--no-deps", "--format-version", "1", "--locked"
          ]))
          versions = {package["version"] for package in metadata["packages"]}
          if versions != {version}:
              sys.exit(f"workspace package versions {sorted(versions)!r} do not match {tag}")
          PY

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Smoke test CLI help
        run: cargo run -p aocsuite-cli --locked -- --help

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: zip
          - os: macos-14
            target: aarch64-apple-darwin
            extension: tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Build CLI
        run: cargo build -p aocsuite-cli --release --locked

      - name: Build TUI
        run: cargo build -p aocsuite-tui --release --locked

      - name: Smoke test CLI binary
        shell: bash
        run: target/release/aocsuite-cli${{ runner.os == 'Windows' && '.exe' || '' }} --help

      - name: Package release archive
        id: package
        shell: bash
        run: |
          archive="aocsuite-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.extension }}"
          files=(
            "target/release/aocsuite-cli${{ runner.os == 'Windows' && '.exe' || '' }}"
            "target/release/aocsuite-tui${{ runner.os == 'Windows' && '.exe' || '' }}"
            README.md
            LICENSE
          )
          if [[ "${{ matrix.extension }}" == "zip" ]]; then
            7z a "$archive" "${files[@]}"
          else
            tar -czf "$archive" "${files[@]}"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes release/*
